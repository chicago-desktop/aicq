version: "1.0"
# Strict security mode requires every process to carry an actor and scope.
# The harness therefore depends on wippy/security (policy groups for
# host-managed services) and on a wippy/test runner that declares
# meta.command.security; suites run with `wippy test` (`make test`).
workspace:
  replacements:
    chicago/aicq: ..
    # The shell and the base are not in the Hub yet: they come from the
    # neighbouring working copies. Remove both once they are published.
    chicago/shell: ../../windows-module
    chicago/tui-desktop: ../../kickside-module
    # The platform is stood in, not booted: each stand-in carries only the
    # libraries aICQ imports (test/stubs/*, README "Development"). Their lock
    # entries keep the real versions, without a hash, so the module's lower
    # bounds hold.
    kickside/agents: ./stubs/agents
    kickside/models: ./stubs/models
    kickside/users: ./stubs/users
    kickside/component: ./stubs/component
    wippy/session: ./stubs/session
override:
  "chicago.tui_desktop:exec:default_env.HOME": "${env:HOME}"
  "chicago.tui_desktop:exec:default_env.PATH": "${env:PATH}"
  # The shell and the base ask the application for the group given access to
  # their endpoints; the harness's permissive scope is enough for the suites.
  "chicago.shell.security:user_security_scope:data.default": app:user
  "chicago.tui_desktop.security:user_security_scope:data.default": app:user
vars:
  pg_host: localhost
  pg_port: 5433
  # <org>_test_<module>: harnesses of different modules share one Postgres
  # server without colliding on database names.
  pg_database: chicago_test_aicq
  pg_username: kickside
  pg_password: kickside
profiles:
  postgres:
    override:
      "app:db:kind": db.sql.postgres
      "app:db:host": "${pg_host}"
      "app:db:port": "${pg_port}"
      "app:db:database": "${pg_database}"
      "app:db:username": "${pg_username}"
      "app:db:password": "${pg_password}"
      "app:db:options.sslmode": disable
      "app:db:pool.max_open": 16
      "app:db:pool.max_idle": 8
