version: "1.0"
namespace: app

# Standalone harness for chicago/aicq. Provides the host resources the boot
# needs (app:db, app:processes, gateway + api router, env storage, a
# permissive actor scope) and wires them through wippy/bootloader, so the
# module's *_test.lua suites run in isolation. The shell and the base are
# resolved from their GitHub repositories by tag (wippy.lock), the platform
# (kickside/agents, models, users, component, wippy/session) from the
# stand-ins in ../stubs (test/.wippy.yaml).
#
# The presence service and the messenger start here as they would in an
# application: people_test talks to both.
#
# Harness-only; excluded from publishing by the module's wippy.yaml.

entries:
  - name: definition
    kind: ns.definition
    meta: { title: aICQ Test Harness }

  - name: db
    kind: db.sql.sqlite
    meta:
      comment: "In-memory database — aICQ's tables, the stand-in users table and the tests' own tables."
    file: ":memory:"

  - name: env_storage
    kind: env.storage.file
    meta:
      type: envstorage
    file_path: ./.wippy/test.env
    auto_create: true

  - name: processes
    kind: process.host
    lifecycle:
      auto_start: true

  # The shell's endpoint entries resolve against these at boot; no suite calls
  # them over HTTP. Not the weather harness's port: both can run at once.
  - name: gateway
    kind: http.service
    addr: :19232
    lifecycle:
      auto_start: true

  - name: api
    kind: http.router
    meta:
      server: gateway
    prefix: /api

  - name: user
    kind: security.policy
    meta:
      comment: "Permissive actor scope for the suites."
    policy:
      resources: '*'
      actions: '*'
      effect: allow

  # The module under test; its source is replaced with ../ in test/.wippy.yaml.
  - name: aicq_harness.dep.module
    version: "*"
    kind: ns.dependency
    meta:
      comment: "The module under test."
    component: "chicago/aicq"
    parameters:
      - name: chicago.aicq:target_db
        value: app:db
      - name: chicago.aicq:process_host
        value: app:processes

  - name: aicq_harness.dep.shell
    version: ">=0.2.0"
    kind: ns.dependency
    meta:
      comment: "The Chicago shell the module runs in; from its GitHub repository by tag, the same source the module names."
    component: github.com/chicago-desktop/shell
    parameters:
      - name: chicago.shell:api_router
        value: app:api

  - name: aicq_harness.dep.migration
    version: "*"
    kind: ns.dependency
    meta:
      comment: "Host binding for the migration dependency."
    component: "wippy/migration"
    parameters:
      - name: wippy.migration:app_db
        value: app:db

  - name: aicq_harness.dep.security
    version: "*"
    kind: ns.dependency
    meta:
      comment: "Platform security groups that give host-managed services their policy scope under strict mode."
    component: "wippy/security"

  - name: aicq_harness.dep.bootloader
    version: "*"
    kind: ns.dependency
    meta:
      comment: "Host wiring for the standalone test harness."
    component: "wippy/bootloader"
    parameters:
      - name: wippy.bootloader:application_host
        value: app:processes
      - name: wippy.bootloader:env_storage
        value: app:env_storage

  # ─── The module's suites ───────────────────────────────────────────────
  # They live here, in the harness, and not in the module's src: the module's
  # `exclude_meta: type: [test]` drops test entries from a module loaded as a
  # dependency, and the harness loads it as one.
  - name: aicq_test
    kind: function.lua
    meta:
      type: test
      comment: "aICQ's contact list — People and Agents apart with online/total counters, online first, the unread envelope, collapsing, the menus, the Info sheets, Remove Contact, both Add items, the messenger's pings, the tray items and the layout."
      group: aICQ
      suite: chicago_aicq
    source: file://aicq_test.lua
    imports:
      test: wippy.test:test
      ui: chicago.shell.sdk:ui
      aicq: chicago.aicq:aicq
    method: run

  - name: message_test
    kind: function.lua
    meta:
      type: test
      comment: "aICQ's message window — the history loaded, marked read and watched on opening, Send and both shapes of Ctrl+Enter, the messenger's pings, the named failures and the layout."
      group: aICQ
      suite: chicago_aicq
    source: file://message_test.lua
    imports:
      test: wippy.test:test
      ui: chicago.shell.sdk:ui
      app: chicago.shell.sdk:app
      editor: chicago.shell.sdk:editor
      aicq: chicago.aicq:aicq
    method: run

  - name: add_contact_test
    kind: function.lua
    meta:
      type: test
      comment: "aICQ's Add Contact — the search, the Name and UIN table, Add three ways, the news to the list, the library's refusals and the layout."
      group: aICQ
      suite: chicago_aicq
    source: file://add_contact_test.lua
    imports:
      test: wippy.test:test
      ui: chicago.shell.sdk:ui
      app: chicago.shell.sdk:app
      aicq: chicago.aicq:aicq
    method: run

  # `directory` is kickside/users' stand-in adapter over the harness's users
  # table; `control` names the desktop family the test answers as.
  - name: people_test
    kind: function.lua
    meta:
      type: test
      comment: "aICQ people — the library on a real SQLite (contacts, send, history order and limit, unread, mark_read, find's three shapes and the cap, UIN, display_name), identity from the actor, the messenger's pings and the per-desktop tray."
      group: aICQ
      suite: chicago_aicq
    source: file://people_test.lua
    modules:
      - channel
      - process
      - sql
      - time
    imports:
      test: wippy.test:test
      people: chicago.aicq:people
      directory: kickside.users.directory:directory_lib
      user_repo: kickside.users.persist:user_repo
      control: chicago.shell.api:control
    method: run

  - name: legacy_test
    kind: function.lua
    meta:
      type: test
      comment: "aICQ's migrations — the stand's app_chat_* rows move over once, a row already there wins, no old table is nothing to do."
      group: aICQ
      suite: chicago_aicq
    source: file://legacy_test.lua
    modules:
      - sql
    imports:
      test: wippy.test:test
      legacy: chicago.aicq:legacy
    method: run

  - name: dialog_args_test
    kind: function.lua
    meta: {type: test, suite: chicago_aicq, group: aICQ}
    source: file://dialog_args_test.lua
    method: run
    modules: [json]
    imports:
      test: wippy.test:test
      args: chicago.aicq:dialog_args
      dialog: chicago.aicq:dialog
      app: chicago.shell.sdk:app
      editor: chicago.shell.sdk:editor
      ui: chicago.shell.sdk:ui
