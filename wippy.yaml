organization: chicago
module: aicq
description: aICQ for the Chicago desktop — people and agents in one ICQ-style contact list, messages between people, the dialog with an agent, and the tray item next to the clock.
license: MIT
repository: https://github.com/chicago-desktop/aicq
homepage: https://wippy.ai
keywords:
  - kickside
  - tui
  - terminal
  - desktop
  - chat
  - icq
  - chicago
exclude_meta:
  type:
    - test
exclude:
  - "wippy.lock"
  - "app:**"
  - "app.env:**"
  - "test/**"
  - "test:**"
  - ".wippy/**"
  - ".wippy:**"
# The image pack lives outside src/ and is packed only when named here.
embed:
  - chicago.aicq:images
